[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpro3_g7"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = "."
addopts = "-v"

[tool.setuptools.packages.find]
include = ["server*", "app*"]