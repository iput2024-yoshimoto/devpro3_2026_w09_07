[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpro3_g7"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-github-actions-annotate-failures>=0.2.0"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "server/src",
    "client/src",
    "lastwork"
]
testpaths = [
    "server/tests",
    "client/tests"
]

[tool.setuptools]
packages = []

[tool.coverage.report]
show_missing = true