name: Pytest and JS Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # --- Python セットアップ ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" 
          cache: pip

      # ライブラリインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-mock pytest-github-actions-annotate-failures
          python -m pip install ".[dev]"

      # センサ/Pythonコードのユニットテスト実行（junit.xml と pytest-coverage.txt を同時出力）
      - name: Run Python tests
        timeout-minutes: 2
        env:
          PYTHONPATH: .:server/src:client/src
          DATA_DIR: ./lastwork
          CSV_FILENAME: sensor_data.csv
          SOCKET_PORT: 5000
        run: |
          pytest -v -s --cov=server/src --cov=client/src --cov-report=term-missing --junitxml=junit.xml | tee pytest-coverage.txt

      # 1. Pytestのテスト結果を Actions の Checks / Report 画面に見やすく表示
      - name: Python Test Report
        uses: dorny/test-reporter@v1
        if: always() # テストが失敗してもレポートを出力する
        with:
          name: Python (Pytest) Tests
          path: junit.xml
          reporter: java-junit # Pytestが出力するJUnit XML形式を読み込む設定

      # 2. カバレッジ結果を PR にコメント投稿（PR時のみ）
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: always()
        with:
          pytest-coverage-path: ./pytest-coverage.txt

      # --- Node.js / Jest (JSテスト) セットアップ ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test