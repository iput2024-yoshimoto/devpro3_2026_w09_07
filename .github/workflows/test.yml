name: Pytest

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v2 

      # Pythonセットアップ
      - name: Set up Python 3.13.5
        uses: actions/setup-python@v2
        with:
          python-version: "3.13.5"
          
      # ライブラリインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask python-dotenv　pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      # ユニットテスト実行の直前にこれを挟むと安全です
      - name: Create dummy .env for testing
        run: |
          echo "DATA_DIR=lastwork" > .env
          echo "CSV_FILENAME=sensor_data.csv" >> .env
          echo "SOCKET_PORT=8765" >> .env
          echo "FLASK_PORT=5000" >> .env
          
      # ユニットテスト実行
      - name: Run tests
        env:
          PROJECT_HOME: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/lastwork
        run: |
          pytest lastwork --cov=lastwork --cov-report=term-missing --junitxml=pytest.xml | tee pytest-coverage.txt
        continue-on-error: true
  
      # テスト結果をプルリクにコメントする
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
