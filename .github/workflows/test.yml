name: Pytest

on:
  push:
    branches: [main,master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  checks: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # Pythonセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" 
          cache: pip
          
      # ライブラリインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-mock
          python -m pip install ".[dev]"
           
      # # ユニットテスト実行
      # ユニットテスト実行
      - name: Run Python tests
        timeout-minutes: 2
        env:
          PYTHONPATH: .:server/src:client/src
          DATA_DIR: ./lastwork
          CSV_FILENAME: sensor_data.csv
          SOCKET_PORT: 5000
        run: |
          pytest -v -s --cov=server/src --cov=client/src --cov-report=term-missing
      # テスト結果をコメントする
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
      # --- Node.js / Jest (JSテスト) セットアップ ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # JSライブラリインストール
      - name: Install Node.js dependencies
        run: npm ci

      # JSユニットテスト実行
      - name: Run JS tests
        run: npm test
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() # テストが失敗しても実行する
        with:
          name: JS Tests
          path: junit.xml # Jest等で出力したレポートXML
          reporter: jest-junit
      
