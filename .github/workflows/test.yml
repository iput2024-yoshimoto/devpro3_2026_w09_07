name: Python Pytest CI

# トリガーの設定：コードが main ブランチに push された時、または Pull Request が送られてきた時に実行
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest # GitHubが用意してくれる仮想Linux環境で実行

    steps:
    # 1. GitHubリポジトリからコードをチェックアウト（コピー）
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/checkout@v4
      with:
        python-version: '3.11' # プロjectに合わせてバージョンは調整してください

    # 3. 仮想環境にダミーのlgpioモジュールを作成（超重要！）
    - name: Mock lgpio for CI environment
      run: |
        mkdir -p site-packages/lgpio
        touch site-packages/lgpio/__init__.py
        echo "def gpiochip_open(*args): return 1" >> site-packages/lgpio/__init__.py
        echo "def gpio_claim_output(*args): pass" >> site-packages/lgpio/__init__.py
        echo "def gpio_claim_input(*args): pass" >> site-packages/lgpio/__init__.py
        echo "def gpio_write(*args): pass" >> site-packages/lgpio/__init__.py
        echo "def gpio_read(*args): return 0" >> site-packages/lgpio/__init__.py
        echo "def gpiochip_close(*args): pass" >> site-packages/lgpio/__init__.py
        echo "SET_PULL_UP = 1" >> site-packages/lgpio/__init__.py
        echo "python path setup completed."
        echo "PYTHONPATH=$PWD/site-packages:$PYTHONPATH" >> $GITHUB_ENV

    # 4. 依存ライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. pytestの実行（小分けに実行してログを見やすくする）
    - name: Run Server Tests
      run: |
        pytest tests/test_server.py -v

    - name: Run Sensor Tests
      run: |
        pytest tests/test_sensor.py -v
